[project]
name = "rag-harry-potter"
version = "0.1.0"
description = "Simple RAG (Retrieval-Augmented Generation) implementation for Harry Potter-themed question answering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "nltk>=3.10.3",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]
